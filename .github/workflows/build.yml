name: Build

# 不随 push 自动构建：只在手动触发或打 v* 标签时跑
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew dist --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: viewmyui-neoforge
          path: dist/*.jar
          if-no-files-found: error

      - name: Upload standalone editor
        uses: actions/upload-artifact@v4
        with:
          name: viewmyui-editor
          path: dist/*.zip
          if-no-files-found: error
