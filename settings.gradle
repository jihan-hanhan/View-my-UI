pluginManagement {
    repositories {
        // NeoGradle 7 插件仓库（1.21.1 起改用 NeoForge 官方 Maven）
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        // 国内可用镜像，优先于官方源，避免 Plugin Portal 访问不畅
        maven {
            name = 'TencentMirror'
            url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'viewmyui'

include 'core'
include 'forge'
include 'editor'
