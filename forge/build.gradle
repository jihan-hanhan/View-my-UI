plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

base {
    archivesName = 'viewmyui-forge-1.20.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    // 1.20.1 使用官方 mappings，dev 环境即反混淆后的名字，
    // 因此 Mixin 里可以直接写 net.minecraft.* 的类名与方法名。
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 编辑器可执行文件路径（Phase 1 用 jpackage 产出后填这里）
            property 'viewmyui.editor', project.file('run/viewmyui/editor').absolutePath
            // 仅在显式传 -PviewmyuiAutocapture=true 时开启自动采集
            if (project.hasProperty('viewmyuiAutocapture')) {
                property 'viewmyui.autocapture', 'true'
            }
            if (project.hasProperty('viewmyuiDebugMixin')) {
                property 'mixin.debug.verbose', 'true'
            }
            // Forge 的 mods.toml 不认 [[mixins]]。dev 环境（forgeclientuserdev）
            // 没有任何可读的 jar manifest，Mixin 只能从命令行参数发现配置：
            // CommandLineOptions 会扫描 sun.java.command 里的 "--mixin <config>"。
            // 生产环境靠下面 jar manifest 里的 MixinConfigs。
            args '--mixin', 'viewmyui.mixins.json'
            mods {
                viewmyui {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    // 本阶段模组只负责采集与落盘，不引用 core；
    // 等做 Overlay 叠加时再加 project(':core')，并处理 jar-in-jar。
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'MixinConfigs': 'viewmyui.mixins.json'
        ])
    }
}

// 把编辑器（core + editor + 全平台 JavaFX）内嵌进模组 jar：
// 运行时 EditorLauncher 首次 F10 解压到 <gameDir>/viewmyui/editor/<版本>/ 再拉起独立进程。
// 用普通资源目录而不是 JarJar——JarJar 是给 FML 加载的库模组用的，启动外部 JVM 用不上。
tasks.named('jar', Jar).configure {
    dependsOn ':editor:editorBundle'
    from(rootProject.file('editor/build/editor-bundle')) {
        into 'META-INF/viewmyui/editor'
    }
}
