allprojects {
    group = 'com.viewmyui'
    version = '0.1.0'
}

subprojects {
    repositories {
        // 国内镜像放在前面，官方源兜底
        maven {
            name = 'TencentMirror'
            url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
        }
        // NeoForge / NeoGradle 制品（1.21.1 模块）
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
    }
}
